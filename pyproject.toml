[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-usage-tracking"
version = "0.26.0.dev0"
description = "Non-publishable integration skeleton for the Codex Usage Tracker data kernel."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Douglas Monsky" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["codex", "tokens", "usage", "local-first"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.scripts]
codex-usage-tracker = "codex_usage_tracker.kernel.interfaces.cli.main:main"

[project.urls]
Homepage = "https://github.com/douglasmonsky/codex-usage-tracker"
Repository = "https://github.com/douglasmonsky/codex-usage-tracker"
Issues = "https://github.com/douglasmonsky/codex-usage-tracker/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8.0",
  "pyright>=1.1.405",
  "ruff>=0.8",
  "tomli>=2.0; python_version < '3.11'",
  "xenon>=0.9.3",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "codex_usage_tracker.kernel*",
  "codex_usage_tracker.release*",
]
namespaces = true

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.py[cod]"]

[tool.setuptools.package-data]
"codex_usage_tracker.kernel.interfaces" = ["schemas/*.json"]
"codex_usage_tracker.kernel.interfaces.http" = [
  "console_assets/*.css",
  "console_assets/*.html",
  "console_assets/*.js",
  "console_assets/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests/kernel", "tests/release"]
pythonpath = [".", "src"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
mypy_path = "src"
explicit_package_bases = true
files = [
  "scripts/check_kernel_maintainability.py",
  "scripts/check_kernel_scope.py",
  "scripts/generate_kernel_interfaces.py",
  "scripts/generate_kernel_manifests.py",
  "scripts/smoke_installed_console.py",
  "src/codex_usage_tracker/kernel",
]

[tool.pyright]
include = [
  "scripts/check_kernel_maintainability.py",
  "scripts/check_kernel_scope.py",
  "scripts/generate_kernel_interfaces.py",
  "scripts/generate_kernel_manifests.py",
  "scripts/smoke_installed_console.py",
  "src/codex_usage_tracker/kernel",
]
pythonVersion = "3.10"
typeCheckingMode = "standard"
