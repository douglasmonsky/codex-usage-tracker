name: Kernel integration CI

on:
  push:
    branches:
      - kernel/0.26-integration
  pull_request:
    branches:
      - kernel/0.26-integration

permissions:
  contents: read

concurrency:
  group: kernel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: Kernel phase and package isolation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install kernel tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Verify kernel phase
        run: |
          python scripts/check_kernel_scope.py
          python scripts/generate_kernel_manifests.py --check
          python -m ruff check \
            scripts/check_kernel_maintainability.py \
            scripts/check_kernel_scope.py \
            scripts/check_release.py \
            scripts/generate_kernel_manifests.py \
            src/codex_usage_tracker/kernel \
            tests/kernel/evidence \
            tests/kernel/live \
            tests/kernel/query \
            tests/kernel/test_code_disposition_manifest.py \
            tests/kernel/test_cutover_control.py \
            tests/kernel/test_database_lifecycle.py \
            tests/kernel/test_development_efficiency_policy.py \
            tests/kernel/test_identity.py \
            tests/kernel/test_ingest_*.py \
            tests/kernel/test_kernel_maintainability.py \
            tests/kernel/test_kernel_scope.py \
            tests/kernel/test_repository_quality_policy.py \
            tests/kernel/test_retired_surface_manifest.py \
            tests/kernel/test_schema.py \
            tests/kernel/test_source_registry_privacy.py \
            tests/kernel/test_oracle_equivalence.py \
            tests/kernel/test_privacy_oracle.py \
            tests/kernel/test_source_lifecycle_oracle.py \
            tests/kernel/test_watcher.py
          python -m mypy
          python scripts/check_kernel_maintainability.py
          python -m pytest -p no:tach \
            --ignore=tests/kernel/test_ingest_performance.py \
            tests/kernel/test_kernel_scope.py \
            tests/kernel/test_code_disposition_manifest.py \
            tests/kernel/test_retired_surface_manifest.py \
            tests/kernel/test_development_efficiency_policy.py \
            tests/kernel/test_kernel_maintainability.py \
            tests/kernel/test_repository_quality_policy.py \
            tests/kernel/test_schema.py \
            tests/kernel/test_identity.py \
            tests/kernel/test_database_lifecycle.py \
            tests/kernel/test_cutover_control.py \
            tests/kernel/test_source_registry_privacy.py \
            tests/kernel/test_ingest_*.py \
            tests/kernel/test_oracle_equivalence.py \
            tests/kernel/test_privacy_oracle.py \
            tests/kernel/test_source_lifecycle_oracle.py \
            tests/kernel/test_watcher.py \
            tests/kernel/evidence \
            tests/kernel/live \
            tests/kernel/query
          python -m pyright --pythonpath "$(command -v python)"
          python scripts/check_release.py
      - name: Run synthetic performance contracts
        if: matrix.python-version == '3.14'
        run: python -m pytest -p no:tach tests/kernel/test_ingest_performance.py
      - name: Build isolated development package
        if: matrix.python-version == '3.14'
        run: |
          python -m build
          python scripts/check_release.py --dist
      - name: Whitespace
        run: git diff --check
