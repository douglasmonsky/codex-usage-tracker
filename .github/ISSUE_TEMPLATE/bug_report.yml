name: Bug report
description: Report a kernel, setup, CLI, MCP/plugin, skill, or 0.28 Console bug without sharing private logs.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste real Codex logs, prompts, assistant text, tool output, secrets, private repo names, or full local paths.
        Reproduce with synthetic data or manually minimize every field before sharing it.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the visible bug and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include setup steps, commands, MCP calls, or 0.28 Console actions that reproduce the issue.
      placeholder: |
        1. Run `codex-usage-tracker ...`
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Minimized diagnostics
      description: Paste only the smallest manually reviewed excerpt needed to show the failure. Replace project names, ids, paths, labels, and account details with synthetic values; never assume an output is sanitized for you.
      render: json
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "`codex-usage-tracker --version`"
  - type: textarea
    id: checks
    attributes:
      label: Checks tried
      description: List any focused validation commands you ran.
