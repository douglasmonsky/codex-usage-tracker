name: Feature request
description: Suggest an exact usage question, bounded fact, agent workflow, or integration improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What usage question should the tracker help answer?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the exact facts, calculation, evidence, or agent behavior you want.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Main surface
      options:
        - Agent question or preset
        - Kernel fact or calculation
        - MCP, plugin, or skill
        - CLI or setup
        - Codex source adapter
        - Optional Data Analytics handoff
        - Documentation
  - type: textarea
    id: data_boundary
    attributes:
      label: Data and sharing boundary
      description: Identify the structural metadata required, whether raw bodies are truly necessary, and what local values a user must review before sharing.
